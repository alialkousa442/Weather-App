<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weather App</title>
  </head>
  <body>
    <main class="app-container">
      <h1>Weather App</h1>

      <form id="search-form">
        <input
          type="text"
          id="city-input"
          placeholder="Enter city name..."
          required
        />
        <span id="error-message" style="display: none;"></span>
        <button type="button" id="search-btn">Search</button>
      </form>

      <div id="weather-display">
        <div class="city">
          <h2 id="city-name"></h2>
          <img
            id="weather-icon"
            src=""
            alt="Weather Icon"
            class="weather-icon"
            style="display: none"
          />
        </div>

        <div class="temp">
          <p id="temp-id"></p>
          <button type="button" id="unit-toggle-btn" style="display: none">
            °C / °F
          </button>
        </div>
        <div id="weather-details">
          <p id="humidity-id"></p>
          <p id="conditions"></p>
        </div>
      </div>
    </main>
  </body>
</html>
